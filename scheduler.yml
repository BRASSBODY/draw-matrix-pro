name: Draw Matrix Pro Scheduler

on:
  schedule:
    - cron: '0 6,10,14,18,22 * * *'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install requests python-dotenv
    
    - name: Create .env file from secrets
      run: |
        echo "BZZOIRO_TOKEN=${{ secrets.BZZOIRO_TOKEN }}" > .env
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
        echo "DATABASE_PATH=data/draw_matrix_pro.db" >> .env
    
    - name: Run fixture analysis
      run: |
        python draw_agent.py fixtures