name: Draw Matrix Pro Scheduler

on:
  schedule:
    # Runs 5 times a day: 6:00, 10:00, 14:00, 18:00, 22:00 UTC
    - cron: '0 6,10,14,18,22 * * *'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install requests python-dotenv
    
    - name: Run fixture analysis
      env:
        BZZOIRO_TOKEN: ${{ secrets.BZZOIRO_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python draw_agent.py fixtures